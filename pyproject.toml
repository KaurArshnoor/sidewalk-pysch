[project]
name = "sidewalk-psych"
version = "0.1.0"
description = "Person B data agents for walkability and mental-health research"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.109", "uvicorn>=0.27", "httpx>=0.27", "python-dotenv>=1.0",
  "openai-agents[litellm]>=0.22", "google-cloud-aiplatform>=1.40",
  "pydantic>=2.10", "pandas>=2.2", "numpy>=2.0", "scipy>=1.14", "statsmodels>=0.14.4",
]

[project.optional-dependencies]
build = ["pyogrio>=0.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
